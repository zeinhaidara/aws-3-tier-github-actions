# Intentional lab trade-offs. These controls are deferred until a real
# certificate, production availability requirements, and production logging
# budget are available.
skip-check:
  - CKV_AWS_2       # HTTP listener remains for the no-certificate dev fallback.
  - CKV_AWS_18      # S3 access logging requires a separate logging bucket.
  - CKV_AWS_91      # ALB access logging requires a dedicated S3 log bucket.
  - CKV_AWS_103     # No TLS listener exists until an ACM certificate is supplied.
  - CKV_AWS_118     # Enhanced RDS monitoring adds cost and is deferred in dev.
  - CKV_AWS_130     # Public subnets intentionally host the internet-facing ALB.
  - CKV_AWS_136     # ECR KMS encryption adds a customer-managed key cost.
  - CKV_AWS_144     # Cross-region state replication is outside this lab scope.
  - CKV_AWS_145     # S3 SSE-S3 is used for state to avoid a KMS key cost.
  - CKV_AWS_150     # ALB deletion protection is unsuitable for lab teardown.
  - CKV_AWS_157     # Multi-AZ RDS is deferred for the low-cost dev environment.
  - CKV_AWS_158     # CloudWatch KMS encryption is deferred for the lab.
  - CKV_AWS_161     # RDS IAM authentication is deferred; access uses Secrets Manager.
  - CKV_AWS_260     # Port 80 remains for the HTTP fallback before ACM is configured.
  - CKV_AWS_293     # RDS deletion protection must remain off for lab teardown.
  - CKV_AWS_338     # One-year log retention is excessive for this short-lived lab.
  - CKV_AWS_378     # ALB-to-app traffic is private VPC HTTP after TLS termination.
  - CKV_AWS_382     # Broad egress is required for package, ECR, and database access.
  - CKV_AWS_341     # EC2 Docker bridge networking requires IMDSv2 hop limit 2.
  - CKV2_AWS_5      # Checkov cannot resolve the module-managed SG attachments.
  - CKV2_AWS_20     # HTTP-to-HTTPS redirect activates when an ACM ARN is supplied.
  - CKV2_AWS_11     # VPC flow logs are deferred to the security-observability phase.
  - CKV2_AWS_28     # WAF is deferred until the public production ALB phase.
  - CKV2_AWS_62     # State-bucket event notifications are unnecessary for this lab.
  - CKV2_AWS_19     # The EIP is deliberately attached to the managed NAT Gateway, not an EC2 instance.
