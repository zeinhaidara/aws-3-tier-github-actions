name: Publish - Application Image

on:
  workflow_run:
    workflows: ["CI - Quality and Security"]
    types: [completed]

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish tested immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: application-image-${{ github.event.workflow_run.head_sha }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load tested image
        run: docker load --input application-image.tar

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish tested image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker tag "cloudbatch818-api:ci-${COMMIT_SHA}" "${REGISTRY}/cloudbatch818-zein-app:sha-${COMMIT_SHA}"
          docker push "${REGISTRY}/cloudbatch818-zein-app:sha-${COMMIT_SHA}"
