name: Terraform networking apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Apply shared networking
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize networking backend
        working-directory: infra/terraform/networking
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=shared/networking.tfstate" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Apply shared networking
        working-directory: infra/terraform/networking
        run: |
          terraform apply -auto-approve -input=false \
            -var='vpc_cidr=${{ vars.VPC_CIDR }}' \
            -var='availability_zones=${{ vars.AVAILABILITY_ZONES }}' \
            -var='enable_nat_gateway=${{ vars.ENABLE_NAT_GATEWAY }}'
