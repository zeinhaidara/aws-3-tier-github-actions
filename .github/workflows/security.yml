name: Security checks

on:
  pull_request:
    branches:
      - main
    paths:
      - app/backend/**
      - infra/terraform/**
      - .github/workflows/security.yml
      - sonar-project.properties
  push:
    branches:
      - main
    paths:
      - app/backend/**
      - infra/terraform/**
      - .github/workflows/security.yml
      - sonar-project.properties
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false

  trivy-filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  trivy-image:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t cloudbatch818-api:security-${{ github.sha }} app/backend

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloudbatch818-api:security-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  sonarqube:
    name: SonarQube code scan
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SonarQube configuration
        run: |
          test -n "$SONAR_HOST_URL" || { echo "Missing SONAR_HOST_URL secret"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "Missing SONAR_TOKEN secret"; exit 1; }

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
