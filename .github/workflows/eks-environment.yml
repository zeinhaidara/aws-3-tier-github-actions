name: EKS environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, prod]
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, apply, destroy]
      image_tag:
        description: Optional immutable ECR tag
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_region: ${{ vars.TF_STATE_REGION }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: deploy/eks
        run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=eks/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=${{ vars.TF_STATE_REGION }}"
      - name: Terraform format and validate
        working-directory: deploy/eks
        run: terraform fmt -check && terraform validate
      - name: Terraform operation
        if: inputs.operation == 'plan'
        working-directory: deploy/eks
        run: terraform plan -input=false
      - name: Terraform operation
        if: inputs.operation == 'apply'
        working-directory: deploy/eks
        run: terraform apply -auto-approve -input=false
      - name: Terraform operation
        if: inputs.operation == 'destroy'
        working-directory: deploy/eks
        run: terraform destroy -auto-approve -input=false
