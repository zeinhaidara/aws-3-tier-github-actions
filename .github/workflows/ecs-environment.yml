name: ECS environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: ECS environment
        required: true
        type: choice
        options:
          - dev
      operation:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      image_tag:
        description: Optional immutable ECR tag; blank uses newest image
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ECS ${{ inputs.environment }} ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_region: ${{ vars.TF_STATE_REGION }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize
        working-directory: deploy/ecs
        run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=ecs/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Format and validate
        working-directory: deploy/ecs
        run: |
          terraform fmt -check
          terraform validate

      - name: Require main for mutations
        if: inputs.operation != 'plan' && github.ref != 'refs/heads/main'
        run: exit 1

      - name: Plan
        if: inputs.operation == 'plan'
        working-directory: deploy/ecs
        run: terraform plan -input=false

      - name: Apply
        if: inputs.operation == 'apply'
        working-directory: deploy/ecs
        run: terraform apply -auto-approve -input=false

      - name: Destroy
        if: inputs.operation == 'destroy'
        working-directory: deploy/ecs
        run: terraform destroy -auto-approve -input=false
