name: Infrastructure - Bootstrap State

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap-state:
    name: Create Terraform state bucket
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      state_bucket: ${{ steps.state.outputs.bucket }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Initialize bootstrap Terraform
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false

      - name: Create state bucket
        working-directory: infra/terraform/bootstrap
        run: terraform apply -auto-approve

      - name: Export state bucket name
        id: state
        working-directory: infra/terraform/bootstrap
        shell: bash
        run: echo "bucket=$(terraform output -raw state_bucket_name)" >> "$GITHUB_OUTPUT"

      - name: Publish state bucket name
        run: |
          echo "Terraform state bucket: ${{ steps.state.outputs.bucket }}"
