name: Build application image

on:
  pull_request:
    branches:
      - main
    paths:
      - app/backend/**
      - .github/workflows/build-image.yml
  push:
    branches:
      - main
    paths:
      - app/backend/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Test and build FastAPI image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Test FastAPI application
        working-directory: app/backend
        run: |
          pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Configure AWS credentials with OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && format('cloudbatch818-api:pr-{0}', github.sha) || format('{0}/cloudbatch818-zein-app:sha-{1}', steps.login-ecr.outputs.registry, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
