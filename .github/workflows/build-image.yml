name: Build application image

on:
  pull_request:
    branches:
      - main
    paths:
      - app/backend/**
      - .github/workflows/build-image.yml
  push:
    branches:
      - main
    paths:
      - app/backend/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build FastAPI image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Test FastAPI application
        working-directory: app/backend
        run: |
          pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate image build
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: false
          tags: cloudbatch818-api:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish immutable image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/cloudbatch818-zein-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
