name: Test - EC2 Load and Scaling

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev]
      url:
        description: HTTPS URL to test, for example https://ec2-dev.example.com/healthz
        required: true
        type: string
      duration_seconds:
        description: Test duration in seconds
        required: false
        default: "600"
        type: string
      concurrency:
        description: Concurrent clients
        required: false
        default: "50"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  load-test:
    name: Load test public EC2 ALB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate load-test inputs
        shell: bash
        env:
          TARGET_URL: ${{ inputs.url }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          [[ "$TARGET_URL" =~ ^https:// ]] || { echo "The target URL must use HTTPS." >&2; exit 1; }
          [[ "$DURATION_SECONDS" =~ ^[0-9]+$ ]] && (( DURATION_SECONDS >= 60 && DURATION_SECONDS <= 900 )) || { echo "Duration must be 60-900 seconds." >&2; exit 1; }
          [[ "$CONCURRENCY" =~ ^[0-9]+$ ]] && (( CONCURRENCY >= 1 && CONCURRENCY <= 200 )) || { echo "Concurrency must be 1-200." >&2; exit 1; }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install load tester
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Show ASG capacity before test
        run: |
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "cloudbatch818-zein-${{ inputs.environment }}-app-asg" \
            --query 'AutoScalingGroups[0].{Min:MinSize,Desired:DesiredCapacity,Max:MaxSize,Instances:length(Instances)}' \
            --output json | tee scaling-before.json

      - name: Run load test
        run: |
          set -euo pipefail
          ab -s 30 -t "${{ inputs.duration_seconds }}" -c "${{ inputs.concurrency }}" -k -g load-test.tsv "${{ inputs.url }}" | tee load-test.txt

      - name: Show scaling result
        if: always()
        run: |
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "cloudbatch818-zein-${{ inputs.environment }}-app-asg" \
            --query 'AutoScalingGroups[0].{Min:MinSize,Desired:DesiredCapacity,Max:MaxSize,Instances:length(Instances)}' \
            --output json | tee scaling-after.json
          aws autoscaling describe-scaling-activities \
            --auto-scaling-group-name "cloudbatch818-zein-${{ inputs.environment }}-app-asg" \
            --max-items 5 \
            --query 'Activities[].{Status:StatusCode,Cause:Cause,Start:StartTime}' \
            --output json | tee scaling-activities.json

      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-load-test-${{ github.run_id }}
          path: |
            load-test.txt
            load-test.tsv
            scaling-before.json
            scaling-after.json
            scaling-activities.json
          if-no-files-found: warn
