name: Terraform networking

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Shared networking plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize networking backend
        working-directory: infra/terraform/networking
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=shared/networking.tfstate" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra/terraform/networking
        run: terraform validate

      - name: Plan
        working-directory: infra/terraform/networking
        run: terraform plan -input=false
